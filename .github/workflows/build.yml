name: Build Android APK for Shri Ji Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP File Safely
        run: unzip -q -o *.zip

      - name: Master Build Process (Crash-Free)
        env:
          EXPO_NO_TELEMETRY: 1
          CI: true
        run: |
          # 1. Sahi Folders Dhoondhein
          MOBILE_DIR=$(find . -type d -name "dukaan-mobile" | head -n 1)
          LIB_DIR=$(find . -type d -name "lib" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$MOBILE_DIR" ]; then echo "App folder nahi mila!"; exit 1; fi

          # 2. Ek Naya Clean Folder Banayein
          mkdir -p /tmp/build-app
          cp -a "$MOBILE_DIR/." /tmp/build-app/
          if [ -n "$LIB_DIR" ] && [ -d "$LIB_DIR" ]; then
            cp -a "$LIB_DIR" /tmp/build-app/lib
          fi
          cd /tmp/build-app

          # 3. PEHLE PACKAGE.JSON CLEAN KAREIN (Taaki npm crash na ho)
          node -e '
            const fs = require("fs"); const path = require("path");
            const appPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!appPkg.dependencies) appPkg.dependencies = {};
            if (!appPkg.devDependencies) appPkg.devDependencies = {};
            
            if (fs.existsSync("./lib")) {
              fs.readdirSync("./lib").forEach(libName => {
                const libPkgPath = path.join("./lib", libName, "package.json");
                if (fs.existsSync(libPkgPath)) {
                  const libPkg = JSON.parse(fs.readFileSync(libPkgPath, "utf8"));
                  ["dependencies", "devDependencies"].forEach(dt => {
                    if (libPkg[dt]) {
                      for (let dep in libPkg[dt]) {
                        if (!dep.startsWith("@workspace/")) {
                           let val = libPkg[dt][dep];
                           if(typeof val === "string" && (val.includes("catalog:") || val.includes("workspace:"))) {
                             appPkg[dt][dep] = "*";
                           } else {
                             appPkg[dt][dep] = val;
                           }
                        }
                      }
                    }
                  });
                }
              });
            }

            delete appPkg.workspaces;
            ["dependencies", "devDependencies", "peerDependencies"].forEach(dt => {
              if (appPkg[dt]) {
                for (let dep in appPkg[dt]) {
                  if (dep.startsWith("@workspace/")) delete appPkg[dt][dep];
                  else if (typeof appPkg[dt][dep] === "string" && (appPkg[dt][dep].includes("catalog:") || appPkg[dt][dep].includes("workspace:"))) appPkg[dt][dep] = "*";
                }
              }
            });

            if (!appPkg.expo) appPkg.expo = {};
            appPkg.expo.name = "Shri Ji Store";
            appPkg.expo.slug = "shri-ji-store";
            if (!appPkg.expo.android) appPkg.expo.android = {};
            appPkg.expo.android.package = "com.shriji.store";
            fs.writeFileSync("package.json", JSON.stringify(appPkg, null, 2));

            if (fs.existsSync("app.json")) {
              const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
              if (!appJson.expo) appJson.expo = {};
              appJson.expo.name = "Shri Ji Store";
              appJson.expo.slug = "shri-ji-store";
              if (!appJson.expo.android) appJson.expo.android = {};
              appJson.expo.android.package = "com.shriji.store";
              fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2));
            }
          '

          # 4. Old lock files delete karein aur Packages Install karein
          rm -f package-lock.json pnpm-lock.yaml yarn.lock
          npm install --legacy-peer-deps --force
          npm install --save-dev babel-plugin-module-resolver --legacy-peer-deps --force

          # 5. Babel Config set karein (Direct Source Code Link, No Crashes)
          echo "module.exports = function(api) { api.cache(true); return { presets: ['babel-preset-expo'], plugins: [['module-resolver', { alias: { '@workspace/db': './lib/db/src', '@workspace/api-client-react': './lib/api-client-react/src', '@workspace/api-zod': './lib/api-zod/src' } }], 'react-native-reanimated/plugin'] }; };" > babel.config.js

          # 6. Missing Database API ko handle karein
          echo "EXPO_PUBLIC_API_URL=https://api.shrijistore.com" > .env

          # 7. Generate Android Native Project
          npx expo prebuild --platform android --clean --no-install

          # 8. Gradle Fixes for Proguard and Duplicates (Taaki app turant open ho)
          echo "android { packagingOptions { pickFirst '**/*.MF'; pickFirst '**/*.so' } }" >> android/app/build.gradle
          echo "android { packaging { pickFirst '**/*.MF'; pickFirst '**/*.so' } }" >> android/app/build.gradle
          sed -i 's/def enableProguardInReleaseBuilds = true/def enableProguardInReleaseBuilds = false/g' android/app/build.gradle
          sed -i 's/enableProguardInReleaseBuilds = true/enableProguardInReleaseBuilds = false/g' android/app/build.gradle
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          sed -i 's/minifyEnabled enableProguardInReleaseBuilds/minifyEnabled false/g' android/app/build.gradle

          # 9. Compile APK
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          # 10. Move APK to Workspace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Shri-Ji-Store.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shri-Ji-Store-APK
          path: Shri-Ji-Store.apk
